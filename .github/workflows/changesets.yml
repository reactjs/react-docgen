name: Release

on:
  push:
    branches:
      - main
      - 8.x

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Do not persist credentials so changesets can use the provided token
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Changesets
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changesets-release
          version: pnpm changesets-version
          title: 8.x Packages ready to publish
          commit: Publish new versions
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}
