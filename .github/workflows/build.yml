name: CI

on:
  push:
    branches:
      - main
      - 8.x
      - renovate/**
  pull_request:

permissions: {}

env:
  NODE_VERSION: '26'

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        babel: ['7', '8']
        node: ['20.9.0', '22', '24', '26', '^27.0.0-0']
        os: ['ubuntu']
        exclude:
          # Keep Node.js 20 support for Babel 7; Babel 8 requires a newer Node.js.
          - babel: '8'
            node: '20.9.0'
          - babel: '8'
            node: '22'
        include:
          - os: ubuntu
            node: '22.18.0'
            babel: '8'
          - os: macos
            node: '26'
            babel: '7'
          - os: macos
            node: '26'
            babel: '8'
          - os: windows
            node: '26'
            babel: '7'
          - os: windows
            node: '26'
            babel: '8'

    name:
      Tests (Babel ${{ matrix.babel }}, Node.js v${{ matrix.node }}, ${{
      matrix.os }})
    runs-on: ${{ matrix.os }}-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: ${{ startsWith(matrix.node, '^') }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Compile against the declared Babel 7 types before testing each runtime.
      - name: Build packages
        run: pnpm build

      - name: Install Babel 8 runtime
        if: "${{ matrix.babel == '8' }}"
        run:
          pnpm --filter react-docgen add --save-exact @babel/core@8.0.1
          @babel/traverse@8.0.4 @babel/types@8.0.4

      - name: Check consumer declarations
        run: pnpm --filter react-docgen exec tsc -p tests/types/tsconfig.json

      - name: Unit tests with coverage
        if: '${{ matrix.node == env.NODE_VERSION }}'
        run:
          pnpm --filter react-docgen --filter @react-docgen/cli --parallel
          --no-bail test --coverage

      - name: Unit tests
        if: '${{ matrix.node != env.NODE_VERSION }}'
        run:
          pnpm --filter react-docgen --filter @react-docgen/cli --parallel
          --no-bail test

      - name: Upload coverage
        if: '${{ matrix.node == env.NODE_VERSION }}'
        continue-on-error: true
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          parallel: true
          flag-name: test-babel-${{ matrix.babel }}-${{ matrix.os }}

  finish:
    needs: tests
    if: ${{ always() }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Close parallel build
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          parallel-finished: true

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  website:
    name: Website test build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec nx run @react-docgen-internal/website:build
